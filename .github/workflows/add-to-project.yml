name: Add Medea issues to shared project

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add Medea issue to Project 7
    runs-on: ubuntu-latest
    steps:
      - name: Add labeled issue
        uses: actions/add-to-project@v2.0.1
        with:
          project-url: https://github.com/orgs/black-belt-badger/projects/7
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: Medea
