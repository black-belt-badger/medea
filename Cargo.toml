[package]
name = "medea"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Marek Dudek"]
description = "Unofficial read-only Rust CLI for Alpaca paper trading state and historical crypto bars, trades and quotes"
license = "BSD-3-Clause"
repository = "https://github.com/black-belt-badger/medea"
readme = "README.md"
keywords = ["alpaca", "cli", "paper-trading", "trading"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
time = { version = "0.3", features = ["macros", "parsing"] }
tempfile = "3.27"
